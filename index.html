<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sucatas Analice — Controle de Caçambas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f3f6f9;color:#222}
header{background:linear-gradient(#7f9eb7,#1f527d);color:#fff;padding:18px;display:flex;align-items:center;gap:14px}
header img{width:64px;height:64px;object-fit:cover;border-radius:14px;background:#fff;padding:3px}
h1{margin:0;font-size:25px}.sub{font-size:16px;margin-top:4px;color:#e5eef5}
nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:10px;position:sticky;top:0;z-index:5;box-shadow:0 1px 6px #0001}
nav button,.btn{border:0;border-radius:10px;padding:12px 15px;font-weight:700;font-size:15px;background:#e8eef5;color:#111;white-space:nowrap}
nav button.active,.primary{background:#1f527d;color:#fff}.danger{background:#d32f2f!important;color:#fff}.secondary{background:#e9eef3}
main{padding:22px;max-width:1200px;margin:auto}.page{display:none}.page.active{display:block}
.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0000000b}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.stat{font-size:18px}.stat b{display:block;font-size:38px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:block;font-weight:700;margin-bottom:5px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccd4dc;border-radius:9px;font-size:15px;background:#fff}
table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:9px;border-bottom:1px solid #e5e9ed;text-align:left}th{background:#f1f5f8}
.tablewrap{overflow:auto}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{color:#66717b;font-size:14px}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#eef3f7}
.login .card{width:100%;max-width:420px}.msg{padding:10px;border-radius:9px;margin:10px 0}.ok{background:#e5f6ea;color:#176b2c}.err{background:#fdeaea;color:#9b1c1c}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e7eef5;font-size:13px;font-weight:700}
@media(max-width:600px){main{padding:12px}header{padding:14px}header img{width:56px;height:56px}h1{font-size:22px}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="card">
    <div style="text-align:center">
      <img id="loginLogo" style="width:90px;height:90px;object-fit:cover;border-radius:18px;background:#fff;padding:4px">
      <h2>Sucatas Analice</h2>
      <p class="small">Controle de Caçambas — acesso seguro</p>
    </div>
    <div id="loginMsg"></div>
    <label>E-mail</label><input id="email" type="email" autocomplete="username">
    <br><label>Senha</label><input id="password" type="password" autocomplete="current-password">
    <br><button class="btn primary" style="width:100%" onclick="login()">Entrar</button>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
<button type="button" class="btn" onclick="openSignup()">Criar minha conta</button>
<button type="button" class="btn" onclick="forgotPassword()">Esqueci minha senha</button>
</div>
<label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px">
<input type="checkbox" id="keepLogged" checked> Manter conectado
</label>
    <button class="btn" style="width:100%;margin-top:8px" onclick="forgotPassword()">🔑 Esqueci minha senha</button>
    <p class="small" style="margin-top:14px">Os dados ficam salvos na nuvem e podem ser acessados por usuários autorizados.</p>
  </div>
</div>

<div id="app" style="display:none">
<header>
  <img id="logo">
  <div><h1>Sucatas Analice</h1><div class="sub">Controle de Caçambas</div></div>
  <div style="margin-left:auto;text-align:right"><div id="userName"></div><button class="btn secondary" onclick="logout()">Sair</button></div>
</header>
<nav>
 <button data-page="dashboard" class="active">📊 Painel</button>
 <button data-page="cacambas">🗑️ Caçambas</button>
 <button data-page="clientes">👥 Clientes</button>
 <button data-page="motoristas">👤 Motoristas</button>

 <button data-page="ordens">📋 Ordens</button>
 <button data-page="movimentacoes">🔄 Movimentações</button>

</nav>
<main>
<section id="dashboard" class="page active"></section>
<section id="cacambas" class="page"></section>
<section id="clientes" class="page"></section>

<section id="ordens" class="page"></section>
<section id="movimentacoes" class="page"></section>
<section id="manutencoes" class="page"></section>
</main>

let cache={cacambas:[],clientes:[],motoristas:[],caminhoes:[],ordens:[]};

function $(id){return document.getElementById(id)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function msg(id,text,ok=false){$(id).innerHTML=`<div class="msg ${ok?'ok':'err'}">${esc(text)}</div>`}
function val(id){return $(id)?.value?.trim()||""}
function today(){return new Date().toISOString().slice(0,10)}
function show(page){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
 $(page).classList.add("active"); document.querySelector(`nav button[data-page="${page}"]`)?.classList.add("active");
 renderPage(page);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.page));

async function login(){
 const email=val("email"), password=$("password").value;
 if(!email||!password)return msg("loginMsg","Informe e-mail e senha.");
 const {error}=await sb.auth.signInWithPassword({email,password});
 if(error)return msg("loginMsg",error.message);
 await startApp();
}
async function forgotPassword(){
 const email=val("email");
 if(!email)return msg("loginMsg","Digite seu e-mail para receber o link de redefinição da senha.");
 const redirectTo=window.location.origin+window.location.pathname;
 const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});
 if(error)return msg("loginMsg",error.message);
 msg("loginMsg","E-mail enviado! Verifique sua caixa de entrada e siga o link para criar uma nova senha.",true);
}
async function updatePassword(){
 const password=$("newPassword").value, confirm=$("confirmPassword").value;
 if(password.length<6)return msg("resetMsg","A nova senha deve ter pelo menos 6 caracteres.");
 if(password!==confirm)return msg("resetMsg","As senhas não são iguais.");
 const {error}=await sb.auth.updateUser({password});
 if(error)return msg("resetMsg",error.message);
 msg("resetMsg","Senha alterada com sucesso! Agora você pode entrar com sua nova senha.",true);
 setTimeout(()=>location.reload(),1200);
}
function showResetPassword(){
 $("login").style.display="flex"; $("app").style.display="none";
 const card=$("login").querySelector(".card");
 card.innerHTML=`<div style="text-align:center"><img src="${logoData}" style="width:90px;height:90px;object-fit:cover;border-radius:18px;background:#fff;padding:4px"><h2>Redefinir senha</h2><p class="small">Crie uma nova senha para acessar o sistema.</p></div><div id="resetMsg"></div><label>Nova senha</label><input id="newPassword" type="password" autocomplete="new-password"><br><label>Confirmar nova senha</label><input id="confirmPassword" type="password" autocomplete="new-password"><br><button class="btn primary" style="width:100%" onclick="updatePassword()">Salvar nova senha</button>`;
}
sb.auth.onAuthStateChange((event)=>{if(event==="PASSWORD_RECOVERY")showResetPassword();});
async function logout(){await sb.auth.signOut();location.reload()}
async function startApp(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){$("login").style.display="flex";$("app").style.display="none";return}
 $("login").style.display="none";$("app").style.display="block";
 $("logo").src=logoData;$("loginLogo").src=logoData;
 const {data:p}=await sb.from("perfis").select("nome,papel,ativo").eq("user_id",session.user.id).maybeSingle();
 if(p && p.ativo===false){await logout();return}
 $("userName").innerHTML=esc(p?.nome||session.user.email)+" <span class='badge'>"+esc(p?.papel||"usuário")+"</span>";

async function load(table,cols="*"){const {data,error}=await sb.from(table).select(cols).order("created_at",{ascending:false});if(error)throw error;return data||[]}
async function loadAll(){
 try{
  cache.cacambas=await load("cacambas");
  cache.clientes=await load("clientes");
  cache.motoristas=await load("motoristas");
  cache.caminhoes=await load("caminhoes");
  cache.ordens=await load("ordens_servico");
 }catch(e){alert("Não foi possível carregar os dados: "+e.message)}
}
async function add(table,row,after){const {error}=await sb.from(table).insert(row);if(error)alert(error.message);else{await loadAll();after?.()}}
async function delRow(table,id,after){if(!confirm("Excluir este registro?"))return;const {error}=await sb.from(table).delete().eq("id",id);if(error)alert(error.message);else{await loadAll();after?.()}}

async function openSignup(){
  const nome=prompt("Digite seu nome:");
  if(!nome) return;
  const email=prompt("Digite seu e-mail:");
  if(!email) return;
  const senha=prompt("Crie sua senha (mínimo recomendado: 8 caracteres):");
  if(!senha) return;
  if(senha.length<6){ alert("A senha precisa ter pelo menos 6 caracteres."); return; }
  const confirm=prompt("Digite a senha novamente:");
  if(senha!==confirm){ alert("As senhas não conferem."); return; }
  const {data,error}=await sb.auth.signUp({email:email.trim(),password:senha,options:{data:{nome:nome.trim()}}});
  if(error){ alert(error.message); return; }
  alert("Conta criada! Se o Supabase solicitar confirmação por e-mail, confirme o endereço e depois entre no sistema. O novo usuário deve ser aprovado/ajustado pelo administrador.");
}

async function forgotPassword(){
  const email=prompt("Digite o e-mail cadastrado:");
  if(!email) return;
  const redirect=location.origin+location.pathname;
  const {error}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:redirect});
  if(error){ alert(error.message); return; }
  alert("Enviamos o link de redefinição de senha para seu e-mail.");
}
</script>
