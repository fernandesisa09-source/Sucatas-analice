<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de Caçambas</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}
header{background:#1f4e78;color:white;padding:18px}
h1{margin:0;font-size:22px}
nav{display:flex;gap:6px;overflow:auto;background:white;padding:8px}
nav button{border:0;background:#e8eef5;padding:10px 12px;border-radius:8px;white-space:nowrap}
nav button.active{background:#1f4e78;color:white}
main{padding:14px;max-width:1100px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.card{background:white;padding:14px;border-radius:10px;box-shadow:0 1px 5px #0001}
.card b{display:block;font-size:25px;margin-top:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd3da;border-radius:7px}
label{font-size:13px;font-weight:bold}
.form{background:white;padding:15px;border-radius:10px;margin:12px 0}
button.primary{background:#1f4e78;color:white;border:0;padding:11px 15px;border-radius:7px}
button.danger{background:#c00000;color:white;border:0;padding:7px;border-radius:6px}
table{width:100%;border-collapse:collapse;background:white;margin-top:12px;font-size:13px}
th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}
th{background:#1f4e78;color:white}
.status{padding:4px 7px;border-radius:12px;font-size:11px}
.small{color:#666;font-size:12px}
@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}table{display:block;overflow:auto}}
</style>
</head>

<nav id="nav"></nav>
<main id="app"></main>
<script>
const KEY="controle_cacambas_v1";
let db=JSON.parse(localStorage.getItem(KEY)||'{"cacambas":[],"clientes":[],"caminhoes":[],"mov":[],"motoristas":[],"ordens":[]}'); if(!db.ordens) db.ordens=[];
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
const tabs=["Painel","Caçambas","Clientes","Caminhões","Ordens de Serviço","Motorista","Movimentações"];
let current="Painel";
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function nav(){document.getElementById("nav").innerHTML=tabs.map(t=>`<button class="${t==current?'active':''}" onclick="go('${t}')">${t}</button>`).join("");}
function go(t){current=t;nav();render(); setupSignature();}
function status(s){let bg={"Disponível":"#e2f0d9","No cliente":"#ddebf7","No pátio":"#fff2cc","Manutenção":"#f4cccc"}[s]||"#eee";return `<span class="status" style="background:${bg}">${esc(s)}</span>`}
function render(){
 let a=document.getElementById("app");
 if(current==="Painel") return painel(a);
 if(current==="Caçambas") return cacambas(a);
 if(current==="Clientes") return clientes(a);
 if(current==="Caminhões") return caminhoes(a);
 if(current==="Ordens de Serviço") return ordens(a); if(current==="Motorista") return motorista(a); if(current==="Movimentações") return movimentos(a);
}
function painel(a){
 let c=db.cacambas;
 a.innerHTML=`<h2>📊 Painel da Operação</h2><div class="cards">
 <div class="card">🟢 Disponíveis<b>${c.filter(x=>x.status==="Disponível").length}</b></div>
 <div class="card">🔵 Com clientes<b>${c.filter(x=>x.status==="No cliente").length}</b></div>
 <div class="card">🟡 No pátio<b>${c.filter(x=>x.status==="No pátio").length}</b></div>
 <div class="card">🔴 Manutenção<b>${c.filter(x=>x.status==="Manutenção").length}</b></div>
 <div class="card">🗑️ Total<b>${c.length}</b></div></div>
 <div class="form"><b>💾 Dados</b><p class="small">Os registros ficam salvos neste navegador. Faça backup periodicamente.</p>
 <button class="primary" onclick="backup()">Exportar backup</button>
 <label style="display:inline-block;margin-left:8px;padding:10px;background:#e8eef5;border-radius:7px;cursor:pointer">Importar backup
 <input type="file" accept=".json" style="display:none" onchange="restore(this.files[0])"></label></div>
 <div class="form"><b>🔎 Pesquisar caçamba</b><div class="grid" style="margin-top:8px"><input id="busca" placeholder="Digite o número" oninput="buscar(this.value)"></div></div>
 <div id="resultado"></div>`;
}
function buscar(q){
 let x=db.cacambas.filter(c=>String(c.num).toLowerCase().includes(q.toLowerCase()));
 document.getElementById("resultado").innerHTML=x.length?`<table><tr><th>Caçamba</th><th>Status</th><th>Cliente</th><th>Caminhão</th><th>Motorista</th><th>Data</th></tr>${x.map(c=>`<tr><td>${esc(c.num)}</td><td>${status(c.status)}</td><td>${esc(c.cliente)}</td><td>${esc(c.caminhao)}</td><td>${esc(c.motorista)}</td><td>${esc(c.data)}</td></tr>`).join("")}</table>`:"<p class='small'>Nenhuma caçamba encontrada.</p>";
}
function cacambas(a){
 a.innerHTML=`<h2>🗑️ Caçambas</h2><div class="form"><div class="grid">
 <div><label>Nº da caçamba</label><input id="num"></div>
 <div><label>Status</label><select id="st"><option>Disponível</option><option>No cliente</option><option>No pátio</option><option>Manutenção</option></select></div>
 <div><label>Cliente atual</label><input id="cli"></div><div><label>Endereço atual</label><input id="end"></div>
 <div><label>Caminhão</label><input id="cam"></div><div><label>Motorista</label><input id="mot"></div>
 <div><label>Data de colocação</label><input id="dt" type="date"></div><div><label>Material</label><input id="mat"></div>
 <div><label>Observações</label><input id="obs"></div></div><br><button class="primary" onclick="addCac()">Adicionar caçamba</button></div>
 <input placeholder="Filtrar..." oninput="filterTable('tCac',this.value)" style="margin-bottom:8px">
 <div id="tCac">${tableCac()}</div>`;
}
function tableCac(filter=""){let arr=db.cacambas.filter(x=>JSON.stringify(x).toLowerCase().includes(filter.toLowerCase()));return `<table><tr><th>Nº</th><th>Status</th><th>Cliente</th><th>Endereço</th><th>Caminhão</th><th>Motorista</th><th>Ações</th></tr>${arr.map((c,i)=>`<tr><td>${esc(c.num)}</td><td>${status(c.status)}</td><td>${esc(c.cliente)}</td><td>${esc(c.end)}</td><td>${esc(c.caminhao)}</td><td>${esc(c.motorista)}</td><td><button class="danger" onclick="del('cacambas',${db.cacambas.indexOf(c)})">Excluir</button></td></tr>`).join("")}</table>`}
function addCac(){let n=document.getElementById("num").value.trim();if(!n)return alert("Informe o número da caçamba.");if(db.cacambas.some(x=>x.num===n))return alert("Esse número já está cadastrado.");db.cacambas.push({num:n,status:st.value,cliente:cli.value,end:end.value,caminhao:cam.value,motorista:mot.value,data:dt.value,material:mat.value,obs:obs.value});save();render();}
function clientes(a){a.innerHTML=`<h2>👥 Clientes</h2><div class="form"><div class="grid"><div><label>Cliente / Razão Social</label><input id="cn"></div><div><label>Responsável</label><input id="cr"></div><div><label>Telefone</label><input id="ct"></div><div><label>Endereço</label><input id="ce"></div><div><label>Cidade</label><input id="cc"></div></div><br><button class="primary" onclick="addCli()">Adicionar cliente</button></div><div id="tCli">${tableCli()}</div>`}
function tableCli(){return `<table><tr><th>Cliente</th><th>Responsável</th><th>Telefone</th><th>Endereço</th><th>Cidade</th><th>Ação</th></tr>${db.clientes.map((x,i)=>`<tr><td>${esc(x.n)}</td><td>${esc(x.r)}</td><td>${esc(x.t)}</td><td>${esc(x.e)}</td><td>${esc(x.c)}</td><td><button class="danger" onclick="del('clientes',${i})">Excluir</button></td></tr>`).join("")}</table>`}

 let n=document.getElementById("rc").value.trim();
 if(!n)return alert("Informe o número da caçamba.");
 let hoje=new Date(), d=hoje.toLocaleDateString("pt-BR"), hora=hoje.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
 let photo="";

 if(pf && pf.files && pf.files[0]){
   const reader=new FileReader();
   reader.onload=()=>{photo=reader.result; registrarServicoFinal(tipo,n,d,hora,photo);};
   reader.readAsDataURL(pf.files[0]); return;
 }
 registrarServicoFinal(tipo,n,d,hora,photo);
 if(c){
   c.caminhao=rcam.value; c.motorista=rm.value;
   if(tipo==="Entrega"||tipo==="Troca"||tipo==="Transferência"){c.status="No cliente";c.cliente=rcli.value;c.end=rend.value;c.data=d;}
   if(tipo==="Retirada"){c.status="No pátio";c.cliente="";c.end="";c.caminhao="";c.motorista="";}

function registrarServicoFinal(tipo,n,d,hora,photo){
 db.mov.push({d,t:tipo,c:n,cli:rcli.value,e:rend.value,cam:rcam.value,m:rm.value,ma:"",o:"OS "+ros.value+" — registrado às "+hora});
 let os=db.ordens.find(x=>x.n===ros.value.trim());
 if(os){
   os.ca=n; os.cl=rcli.value; os.ed=rend.value; os.cm=rcam.value; os.mo=rm.value;
   if(tipo==="Entrega"){os.st="Entregue"; os.de=d;}
   if(tipo==="Retirada"){os.st="Concluída";}
   os.photo=photo; os.sig=getSig();
   if(navigator.geolocation) navigator.geolocation.getCurrentPosition(p=>{os.lat=p.coords.latitude.toFixed(6);os.lng=p.coords.longitude.toFixed(6);save();},()=>save(),{enableHighAccuracy:true,timeout:8000});
 }
 let c=db.cacambas.find(x=>x.num===n);
 if(c){
   c.caminhao=rcam.value; c.motorista=rm.value;
   if(tipo==="Entrega"||tipo==="Troca"||tipo==="Transferência"){c.status="No cliente";c.cliente=rcli.value;c.end=rend.value;c.data=d;}
   if(tipo==="Retirada"){c.status="No pátio";c.cliente="";c.end="";c.caminhao="";c.motorista="";}
 }
 save(); alert("Serviço registrado!"); render();
}
function getSig(){let c=document.getElementById("sigCanvas"); return c?c.toDataURL("image/png"):"";}
function clearSig(){let c=document.getElementById("sigCanvas"); if(c)c.getContext("2d").clearRect(0,0,c.width,c.height);}
function setupSignature(){
 const c=document.getElementById("sigCanvas"); if(!c)return;
 const ctx=c.getContext("2d"); let drawing=false;
 function pos(e){const r=c.getBoundingClientRect(), p=e.touches?e.touches[0]:e; return {x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height};}
 function start(e){drawing=true;ctx.beginPath();const p=pos(e);ctx.moveTo(p.x,p.y);e.preventDefault();}
 function move(e){if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();}
 c.addEventListener("mousedown",start);c.addEventListener("mousemove",move);c.addEventListener("mouseup",()=>drawing=false);
 c.addEventListener("touchstart",start,{passive:false});c.addEventListener("touchmove",move,{passive:false});c.addEventListener("touchend",()=>drawing=false);
}

<script>
function backup(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
 const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
 a.download="backup-controle-cacambas.json"; a.click(); URL.revokeObjectURL(a.href);
}
function restore(file){
 if(!file)return;
 const r=new FileReader();
 r.onload=()=>{try{db=JSON.parse(r.result);save();alert("Backup importado com sucesso!");render();}catch(e){alert("Arquivo de backup inválido.");}};
 r.readAsText(file);
}
</script>
